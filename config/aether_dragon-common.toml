[mount]
	#驯服天境龙的最大生命值 / Max health of the tamed Aether Dragon mount
	#Range: 1.0 ~ 4096.0
	maxHealth = 300.0
	#驯服天境龙的飞行速度（格/刻）/ Flying speed of the mount in blocks per tick
	#Range: 0.1 ~ 5.0
	flySpeed = 3.4
	#骑乘激光每 4 刻结算一次的基础伤害 / Base mount laser damage dealt every 4 ticks
	#Range: 0.0 ~ 2048.0
	laserDamage = 7.0
	#骑乘激光额外伤害 = 骑手攻击力 × 此倍率 / Extra laser damage = rider attack damage × this multiplier
	#Range: 0.0 ~ 100.0
	laserAttackScale = 0.2
	#骑乘激光最大射程（格）/ Maximum range of the mount laser in blocks
	#Range: 4.0 ~ 128.0
	laserRange = 48.0
	#驯服天境龙的地面移动速度 / Ground movement speed of the mount
	#Range: 0.05 ~ 2.0
	walkSpeed = 0.35
	#驯服天境龙死亡后再次召唤的冷却秒数 / Seconds before a dead mount can be summoned again
	#Range: 0 ~ 86400
	respawnSeconds = 2400

