
[General]
	#Whether Rotten Flesh afflicts you with Rotten Stink
	ROTTEN_CONSUMPTION_ENABLED = true
	#Whether soul stratisfaction is enabled
	SOUL_STRATIFICATION_EFFECT_ENABLED = true
	#Whether spirits disappear in the sun is enabled
	SPIRIT_DISSAPPEAR_IN_SUN_ENABLED = true
	#Whether mobs retalliate to other mobs attacking them
	RETALLIATION_ENABLED = true
	#Whether infested diamonds generate
	INFESTED_DIAMONDS_ENABLED = true
	#Whether you get the warning effect that you get for Missioners and Nightmare Stalkers
	WARNING_SPAWN_ENABLED = false
	#Whether you gain naughtiness from certain actions
	NAUGHTINESS_ENABLED = true
	#Forces the Chaotic Spring event on outside its usual dates (Born in Chaos's seasonal events game rule still applies)
	CHAOTIC_SPRING_ENABLED = true
	#Forces the Chilling Horror event on outside its usual dates (Born in Chaos's seasonal events game rule still applies)
	CHILLING_HORROR_ENABLED = true

