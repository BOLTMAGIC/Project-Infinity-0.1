
#末影龙基础属性
[dragon]
	#是否需要用终焉水晶特殊召唤才会出现加强版末影龙；false 时所有末影龙都是加强版
	requireSpecialSummon = true
	#末影龙最大生命值
	#Range: 1.0 ~ 1000000.0
	maxHealth = 1000.0
	#末影龙基础攻击力，所有技能伤害 = 基础攻击力 × 技能倍率
	#Range: 0.0 ~ 10000.0
	attackDamage = 20.0
	#头部撞击伤害倍率
	#Range: 0.0 ~ 100.0
	headContactMultiplier = 1.0
	#翅膀拍击伤害倍率
	#Range: 0.0 ~ 100.0
	wingContactMultiplier = 0.5
	#击退整体倍率，实际击退还会乘以 (1 - 击退抗性)
	#Range: 0.0 ~ 10.0
	knockbackMultiplier = 0.5
	#进入第二阶段的血量百分比
	#Range: 0.0 ~ 1.0
	stageTwoHealth = 0.5
	#进入第三阶段（狂暴）的血量百分比
	#Range: 0.0 ~ 1.0
	stageThreeHealth = 0.25
	#两次技能之间的最短间隔（tick）
	#Range: 0 ~ 10000
	actionInterval = 60
	#狂暴阶段的冷却倍率
	#Range: 0.05 ~ 10.0
	rageCooldownMultiplier = 0.6
	#索敌范围
	#Range: 16.0 ~ 1024.0
	combatRange = 150.0

#技能配置
[skills]
	#启用虚空吐息
	voidBreath_enabled = true
	#虚空吐息冷却（tick）
	#Range: 0 ~ 100000
	voidBreath_cooldown = 150
	#虚空吐息伤害倍率
	#Range: 0.0 ~ 1000.0
	voidBreath_damageMultiplier = 0.35
	#虚空吐息选择权重
	#Range: 0 ~ 1000
	voidBreath_weight = 10
	#虚空灼痕每次伤害倍率
	#Range: 0.0 ~ 100.0
	voidBreath_scorchMultiplier = 0.15
	#吐息落点追踪玩家的速度（格/tick），玩家疾跑约为 0.28
	#Range: 0.0 ~ 5.0
	voidBreath_trackSpeed = 0.27
	#启用末影陨星
	meteor_enabled = true
	#末影陨星冷却（tick）
	#Range: 0 ~ 100000
	meteor_cooldown = 180
	#末影陨星伤害倍率
	#Range: 0.0 ~ 1000.0
	meteor_damageMultiplier = 1.2
	#末影陨星选择权重
	#Range: 0 ~ 1000
	meteor_weight = 10
	#陨星数量
	#Range: 1 ~ 64
	meteor_count = 6
	#陨星爆炸半径
	#Range: 0.5 ~ 32.0
	meteor_radius = 4.5
	#陨星是否破坏方块
	meteor_breakBlocks = false
	#启用空间裂隙冲刺
	riftDash_enabled = true
	#空间裂隙冲刺冷却（tick）
	#Range: 0 ~ 100000
	riftDash_cooldown = 130
	#空间裂隙冲刺伤害倍率
