version = 3
# (Default: 19) Worker threads used for chunk generation and IO.
globalExecutorParallelism = "default"
# (Default: 32) Highest view/render distance allowed (vanilla caps at 32, max 125). Higher values need more memory.
maxViewDistance = "default"

[fixes]
	# (Default: true) Remove the log4j2 shutdown hook so shutdown logs survive, and force exit if a dedicated server hangs.
	disableLoggingShutdownHook = "default"
	# (Default: true) Fix thread-safety issues in vanilla chunk IO.
	chunkIoThreadingIssues = "default"
	# (Default: true) Fix thread-safety issues in the vanilla chunk system.
	generalThreadingIssues = "default"
	# (Default: true) Fix thread-safety issues in vanilla world generation. Required by threadedWorldGen.
	worldGenThreadingIssues = "default"
	# (Default: false) Crash instead of warn when something uses the world random off-thread. For debugging.
	enforceSafeWorldRandomAccess = "default"
	# (Default: true) Fix vanilla world generation bugs.
	vanillaWorldGenBugs = "default"

[generalOptimizations]
	# (Default: true) Reduce allocations in hot paths.
	reduceAllocations = "default"
	# (Default: true) Apply our world generation allocation patches ahead of ModernFix's equivalent ones. Disable to let ModernFix win instead.
	overrideModernFixWorldGenAllocations = "default"
	# (Default: true) Serve off-thread chunk requests without blocking the server thread.
	optimizeAsyncChunkRequest = "default"
	# (Default: true) Faster Perlin noise sampling. Produces identical terrain.
	optimizeNoiseSampling = "default"
	# (Default: true) Optimize chunk task scheduling.
	optimizeScheduling = "default"
	# (Default: 100000) Nanoseconds between chunk tasks run inside the tick loop. -1 disables.
	midTickChunkTasksInterval = "default"

	[generalOptimizations.autoSave]
		# (Default: ENHANCED) VANILLA, ENHANCED (save during idle time) or PERIODIC (every 6000 ticks). Keep the quotes.
		mode = "default"
		# (Default: 20000) Milliseconds before a dirty chunk is auto-saved. ENHANCED only.
		delay = "default"

[ioSystem]
	# (Default: true) Enable chunk IO optimizations.
	optimizations = "default"
	# (Default: 8192) Cached chunk writes before flushing to disk starts.
	chunkDataCacheSoftLimit = "default"
	# (Default: 32768) Hard cap on cached chunk writes.
	chunkDataCacheLimit = "default"
	# (Default: -1) Compression for newly saved chunks. -1 vanilla, 1 GZip, 2 Zlib, 3 none. Existing chunks stay readable.
	chunkStreamVersion = "default"
	# (Default: false) Allocation-free chunk writer. Cannot fire Forge ChunkDataEvent.Save, so mods lose their per-chunk data. Back up first.
	# Set to false for the following reasons: 
	# Incompatible with architectury@9.2.14 (*) (defined in fastchunkgen) 
	gcFreeChunkSerializer = "default"
	# (Default: true) Use the rewritten IO implementation.
	replaceImpl = "default"
	# (Default: true) Load and unload chunks off the server thread.
	async = "default"
	# (Default: true) Regenerate chunks that fail to load. Destroys their contents.
	recoverFromErrors = "default"
	# (Default: true) Fire Forge ChunkDataEvent.Save on async saves. Off means mods lose per-chunk data.
	fireForgeChunkDataEvents = "default"
	# (Default: true) Fire Forge chunk data events and deserialize chunk capabilities on the server thread. Off is unsafe for most mods.
	forgeChunkDataEventsOnMainThread = "default"
	# (Default: true) Snapshot block entity NBT on the server thread when a chunk save starts. Disabling serializes them on IO workers instead, which is faster but races modded block entities and Forge capabilities.
	serializeBlockEntitiesOnMainThread = "default"
	# (Default: true) Check that the oversized chunk file exists before deleting it after each chunk save. Avoids an internal exception per save on Windows.
	skipMissingExternalChunkDelete = "default"

[vanillaWorldGenOptimizations]
	# (Default: true) Cheaper random instances during world generation.
	optimizeRandomInstances = "default"
	# (Default: true) Optimize vanilla world generation.
	enabled = "default"
	# (Default: true) Faster aquifer sampling.
	optimizeAquifer = "default"
	# (Default: true) Cache End biome lookups.
	useEndBiomeCache = "default"
	# (Default: true) Cache the hashCode of density function and spline records. They are immutable, so the value never changes.
	cacheDensityFunctionHashes = "default"
	# (Default: true) Skip the NoiseChunk wrapper map for density functions it would hand straight back. Only marker nodes own a cache that has to be shared.
	skipRedundantDensityFunctionWrapping = "default"
	# (Default: true) Reuse density function nodes whose inputs did not change when a chunk maps the noise router instead of rebuilding every node per chunk, and skip the throwaway holder pair NoiseChunk unwraps immediately.
	identityPreservingDensityFunctionMapAll = "default"
	# (Default: true) Compute noise that neighbouring chunks both need once instead of in each chunk.
	shareNoiseBetweenChunks = "default"
	# (Default: true) Build the surface rule tree once per worker and point it at each new chunk and carved block instead of rebuilding every rule object each time.
	reuseSurfaceRules = "default"

[threadedLighting]
	# (Default: true) Run light updates on a dedicated thread.
	enabled = "default"

[threadedWorldGen]
	# (Default: true) Generate chunks on multiple threads.
	enabled = "default"
	# (Default: true) Generate features (trees, ores, structures) in parallel.
	allowThreadedFeatures = "default"
	# (Default: true) Lock fewer neighbouring chunks per generation step. More parallelism.
	reduceLockRadius = "default"
	# (Default: true) Schedule generation tasks off the server thread.
	asyncScheduling = "default"
	# (Default: true) Abort an in-progress generation step when the chunk is no longer requested. Set to false if a pregenerator reports skipped chunks.
	allowGenerationCancellation = "default"

