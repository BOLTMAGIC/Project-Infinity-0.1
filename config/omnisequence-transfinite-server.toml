
#Transfinite Compute Nexus power settings.
#超限算枢耗电设置。
[transfinite_compute_nexus]
	#Base idle power for the Transfinite Compute Nexus in AE/t. Requires power and one channel.
	#超限算枢的基础待机耗电（AE/t）；需要供电和一个频道。
	#Range: > 1
	idle_power = 16384

#Event Horizon Singularity Hub resource collection and matter duplication settings.
#视界奇点天枢的资源采集与物质复制设置。
[singularity_hub]

	#Singularity sequence-matter duplication and black-hole energy settings.
	#奇点序质复制与黑洞能源设置。
	[singularity_hub.singularity_duplication]
		#Sequence Matter per miniature black hole per cycle, in mB; requires energy and ME fluid space, not a sample.
		#每个微型黑洞每次的奇点序质产量（mB）；需能源和 ME 流体空间，无需样品。
		#Range: 1 ~ 1000000
		matter_per_black_hole = 1
		#FE consumed per millibucket of singularity sequence matter. Full-cycle FE cost = black-hole count * matter_per_black_hole * fe_per_unit.
		#每生产 1 mB 奇点序质流体消耗的 FE；满速每次消耗 = 黑洞数量 × matter_per_black_hole × fe_per_unit。
		#Range: > 1
		fe_per_unit = 2147483647
		#AE power consumed per millibucket of singularity sequence matter. Full-cycle AE cost = black-hole count * matter_per_black_hole * ae_per_unit.
		#每生产 1 mB 奇点序质流体消耗的 AE；满速每次消耗 = 黑洞数量 × matter_per_black_hole × ae_per_unit。
		#Range: > 1
		ae_per_unit = 2147483647
		#Use energy sources in list order. fe comes from adjacent blocks; ae comes from the connected ME network.
		#按列表顺序使用能源。fe 来自相邻方块，ae 来自已连接的 ME 网络。
		energy_priority = ["fe", "ae"]
		#Ticks between sequence-matter production cycles. 20 ticks = 1 second; production never catches up with missed cycles.
		#奇点序质生产间隔（tick）；20 tick = 1 秒，卸载或暂停期间不补发产物。
		#Range: 1 ~ 1200
		interval_ticks = 1200

	#Collection item tags, item-ID blacklist, per-item output and collection interval.
	#采集物品标签、物品 ID 黑名单、单类产量和采集间隔。
	[singularity_hub.singularity_collection]
		#Exact item IDs excluded from resource collection, even when their whitelist tags match. An empty list excludes nothing.
		#资源采集物品 ID 黑名单，优先于物品标签白名单；留空 [] 不排除物品。
		#Example / 示例：item_blacklist = ["minecraft:raw_iron", "minecraft:oak_log"]
		item_blacklist = []
		#Output per resource each collection cycle, not sample copying. Default: 1000.
		#每次采集时，每种资源的产出数量，不控制样品复制。默认：1000。
		#Range: 1 ~ 1000000
		batch_size = 1000
		#Select resources by item tag, with or without #. Tags are merged and deduplicated before the item blacklist is applied. An empty list stops collection.
		#按物品标签设置采集范围。可带或不带 #；多个标签合并去重，再排除物品黑名单。留空 [] 停止采集。
		item_tags = ["#forge:raw_materials", "#c:raw_ores", "#c:raw_materials", "#minecraft:raw_ores", "#minecraft:logs", "#c:logs"]
		#Ticks between resource collection cycles, not sample copying. Changing this starts a fresh cycle. Default: 20.
		#两次资源采集之间的 tick 数，修改后重新计时；不控制样品复制。默认：20。
		#Range: 1 ~ 1200
		interval_ticks = 20

#Shared multiblock chunk-loading settings.
#所有多方块共用的区块加载设置。
[multiblocks]
	#Keep multiblock chunks loaded while formed or under construction. When disabled, keep the machine and its motion area loaded yourself. Miniature white holes always keep their chunks loaded.
	#多方块成型或施工时保持所占区块加载。关闭后需自行加载机器及运动范围所在区块。微型白洞始终保持加载。
	force_load_chunks = true

#Omni-Computation Core crafting dispatch and output-return settings.
#万物演算核心的合成派发与产物回收设置。
[omni_computation]

	#Crafting dispatch budgets, batch transfers and output-return settings.
	#合成派发预算、批量推送和产物回收设置。
	[omni_computation.dispatch]
		#Maximum dispatch work units per Omni controller and tick. Input extraction and each provider attempt cost one unit, regardless of logical batch size.
		#单个万物演算核心每 tick 的派发工作预算；一次输入抽取和一次供应器尝试各计一个单元，与批次数量无关。
		#Range: 64 ~ 9223372036854775807
		omni_dispatch_max_work_units = 2147483647
		#Maximum single-craft dispatch calls per Omni-Computation Core per tick.
		#每个万物演算核心每 tick 的单份配方推送次数上限。
		#Range: > 256
		omni_compat_dispatch_max_calls_per_tick = 2147483647
		#Maximum single-craft dispatch time per tick in microseconds, shared by all active Omni-Computation Cores. The budget shrinks as average server MSPT approaches 45.
		#所有活跃万物演算核心共享的每 tick 单份配方派发时间预算（微秒）；平均 MSPT 接近 45 时自动收缩。
		#Range: 250 ~ 50000
		omni_compat_dispatch_max_time_us = 50000
		#Return UselessMod intermediate outputs directly to their live bound CPU on the same network. Unsupported queues use normal return.
		#将 UselessMod 中间产物直接返回同一网络中实时绑定的 CPU；不支持的队列使用普通回收。
		omni_direct_native_output_return = true
		#Allow batch material transfers to compatible providers. When disabled, transfer one craft at a time.
		#允许向兼容供应器批量推送合成材料。关闭后每次只推送一份。
		omni_batch_dispatch_enabled = true
		#Combine output-return notifications for each resource to reduce repeated updates.
		#合并同种资源的产物回收通知，减少重复更新。
		omni_coalesce_return_notifications = true

#Sequence Array controller, construction, and power settings.
#构序阵列控制器、结构施工与耗电设置。
[sequence_array]
	#Molecular Center idle power usage in AE/t.
	#构序阵列控制器维持 ME 联网时的基础待机耗电（AE/t）。
	#Range: 1 ~ 4096
	idle_power = 128
	#Pattern pages per Sequence Array, with 36 slots per page.
	#构序阵列的样板页数，每页 36 槽。
	#Range: 1 ~ 300
	pattern_pages = 200
	#Maximum Sequence Array structure blocks placed or removed per tick.
	#构序阵列每 tick 最多安放或拆卸的结构方块数。
	#Range: 1 ~ 256
	build_blocks_per_tick = 32

