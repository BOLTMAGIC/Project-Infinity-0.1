# Sleepium settings
#
# Every switch of Sleepium with what it does and its default. A line key=value here wins over the default;
# a line starting with # uses the default (so a new version's defaults reach you). A -Dkey=value launch flag
# wins over this file. The in-game settings screen (Options -> Sleepium...) writes this file too.
# Most switches take effect after a restart (a server: edit, then restart it). true = on, false = off.
# Switches marked "part of" belong to another one: switching that one off switches them off too.

# ==== Terrain rendering ====
# Chunks drawn in a few multi-draws, packed vertices, mesh and draw memos, render cache.

# exp/ambient-skip (client): doAnimateTick asks the biome of every random position it samples (twice 667 per tick) only for its ambient particle.
#lab.opt.AmbientParticleSkipMixin=true

# exp/block-mesh-memo (client): tesselateBlock's AO / flat tesselation against the client level served from BlockMeshMemo while the section around the block is unchanged (pistons' moving blocks, falling blocks, …).
#lab.opt.BlockMeshMemoMixin=true

# BlockMeshMemoMixin: the section marks vanilla makes for its chunk meshes (every block, light and chunk change goes through setSectionDirty), a renderer reset or a new level (everything stale), and the frame counter for eviction.
# (part of lab.opt.BlockMeshMemoMixin)
#lab.opt.BlockMeshDirtyMixin=true

# exp/chunk-multidraw (client): the opaque chunk layers through ChunkMultiDraw (one multi-draw per region).
#lab.opt.ChunkMultiDrawMixin=true

# ChunkMultiDraw: tags the section's layer buffers; a reset (origin change, release) frees its arena entries.
# (part of lab.opt.ChunkMultiDrawMixin)
#lab.opt.ChunkSectionMixin=true

# ChunkMultiDraw: the vanilla chunk vertex shaders get the multi-draw offset path (see ChunkMultiDraw.patch); the entity shaders the residents' path.
# (part of lab.opt.ChunkMultiDrawMixin, lab.opt.PartBatchMixin, lab.opt.ParticleGpuMixin)
#lab.opt.ChunkShaderPatchMixin=true

# ChunkMultiDraw: a section layer's mesh is also copied into its region arena before vanilla uploads it.
# (part of lab.opt.ChunkMultiDrawMixin)
#lab.opt.ChunkUploadMixin=true

# exp/client-biome-memo (client): the render thread's noise-biome lookups (fog colour: 216 per frame, sky colour, the ambient particles of animateTick: ~1300 per tick) answered from a per-level memo of quart position -> biome holder.
#lab.opt.ClientBiomeMemoMixin=true

# ClientBiomeMemoMixin: every change of the chunk data (or of which chunks count as present) clears the biome memo.
# (part of lab.opt.ClientBiomeMemoMixin)
#lab.opt.ClientChunkCacheBiomeMixin=true

# The per-frame garbage fixes in one switch: fog colour, frustum and light checks of entities and block entities, item frames, memoized lookups - without allocating every frame.
#lab.opt.FrameGarbageMixin=true

# exp/frame-garbage (client): ItemFrameRenderer.getRenderOffset depends on the frame's direction only; the six values, each made once by the same expression, instead of a new Vec3 per frame per item frame (Vec3 is immutable).
# (part of lab.opt.FrameGarbageMixin)
#lab.opt.ItemFrameOffsetMixin=true

# exp/frame-garbage (client): the overworld's brightness-dependent fog colour (a multiply per fetched colour, 216 per frame) remembered per input colour instance and brightness: with Vec3FromRgbMixin the inputs are the same few instances, and the function is pure (the same product of the same doubles)
# (part of lab.opt.FrameGarbageMixin)
#lab.opt.OverworldFogMixin=true

# ParallelEntitiesMixin: the worker renderer sets follow a resource reload.
# (part of lab.opt.ParallelEntitiesMixin)
#lab.opt.ParallelReloadMixin=true

# ParallelRender: render-thread work a renderer defers from a worker job (RenderSystem.setShaderTexture and the other "off the render thread: record it" calls) is kept in the job and run on the render thread when the job is merged, in job order, instead of at the next frame's queue flush.
# (part of lab.opt.ParallelEntitiesMixin)
#lab.opt.RenderCallJournalMixin=true

# exp/uniform-dedupe (client): ShaderInstance.apply sets each sampler uniform to its texture unit on every apply; the unit of a sampler never changes for a program, so after the first time the call is skipped (per program instance, per location, forgotten when the instance's program changes).
# (part of lab.opt.UniformDedupeMixin)
#lab.opt.SamplerUnitDedupeMixin=true

# exp/section-layers (client): CompiledChunk.isEmpty(layer) (1.21.1: CompiledSection) is asked for every visible section and every chunk layer each frame; vanilla searches an ObjectArraySet (a second object and its array per section).
#lab.opt.SectionLayerMaskMixin=true

# exp/section-lists (client): renderLevel's block entity loop and renderChunkLayer's loops (translucent, tripwire) walk SectionLists' compact lists instead of every visible section; a compiled section arriving bumps the generation.
#lab.opt.SectionListsMixin=true

# Goes with BlockCollisionMemoMixin: a modification counter per chunk section, bumped at every write of its block states (setBlockState, both paths, and the client packet read); these are the only writers of the container.
# (part of lab.opt.BlockCollisionMemoMixin)
#lab.opt.SectionModCountMixin=true

# exp/shader-samplers (client): ShaderInstance.apply() asks the driver for every sampler's uniform location by name (glGetUniformLocation, a string lookup in the driver) on every apply: a third of the render thread's native time (JFR).
#lab.opt.ShaderSamplerCacheMixin=true

# ParallelRender: AbstractTexture.getId() inside a worker job.
# (part of lab.opt.ParallelEntitiesMixin)
#lab.opt.TextureIdWorkerMixin=true

# ParallelRender: a texture registered from a worker job (a renderer's first getTexture of a new path) would be put in the manager while its GL upload waits in the job's journal, and a job that then fails drops the journal: the texture stays registered and never uploaded (black).
# (part of lab.opt.ParallelEntitiesMixin)
#lab.opt.TextureRegisterWorkerMixin=true

# exp/uniform-dedupe (client): Uniform.upload sends the value only when it differs from the one this uniform last sent to its location.
#lab.opt.UniformDedupeMixin=true

# VertexSortRadixMixin: the translucent sort of world rendering taken straight from the vertex buffer (QuadSort.putDirect).
# (part of lab.opt.VertexSortRadixMixin)
#lab.opt.VertexSortDirectMixin=true

# exp/quad-sort (client): carrier only.
#lab.opt.VertexSortRadixMixin=true

# exp/render-cache (client): the block entity renderer call of setupAndRender goes through RenderCache.
# (part of lab.opt.RenderCacheMixin)
#lab.opt.RenderCacheBlockEntityMixin=true

# The render cache's animation probe also moves the wall clock (GLFW time): renderers that animate by it (GeckoLib's block entities: RenderUtil.getCurrentTick() = Blaze3D.getTime() * 20) otherwise record the same output twice and are taken for static.
# (part of lab.opt.RenderCacheMixin)
#lab.opt.RenderCacheClockMixin=true

# exp/render-cache (client): the entity renderer call of EntityRenderDispatcher.render goes through RenderCache (the dispatcher's own flame, shadow and hitbox stay as they are).
#lab.opt.RenderCacheMixin=true

# Animated textures (water, lava, fire, mods' animated blocks) change frames by a GPU copy instead of an upload from the CPU: less work on the render thread, the same picture.
#lab.opt.GpuAnim=true

# The F3 debug screen's lines are gathered 10 times a second instead of every frame (its FPS line changes once a second anyway): opening F3 no longer costs a large part of your frame rate. sleep.f3.refreshMs sets the interval.
#lab.opt.DebugScreenCacheMixin=true

# Forge works out each armour piece's texture path with text formatting for every mob in every frame; with this on it is worked out once per item, slot and layer and reused (items that choose their texture per stack or wearer are left as they are): crowds in armour draw faster.
#lab.opt.ArmorResourceMemoMixin=true

# Forge draws the F3 text a line at a time, each line sent to the graphics card on its own; with this on it is drawn in one batch, as vanilla Minecraft does: F3 open costs far less.
#lab.opt.ForgeHudTextBatchMixin=true

# Chunk sections in view picked from flat arrays instead of the occlusion graph's linked set: no stall when the camera turns at far view distances (32 chunks: 167 -> 1100 fps while turning), the same sections in the same order.
#lab.opt.FrustumRegionMixin=true

# GPU terrain: chunk sections meshed on the graphics card from the blocks as the server sends them, far terrain as coarser cells (level of detail beyond 6 chunks, coarser again beyond 10). Less CPU per frame and fewer triangles: on an Intel N100 a flight 88 -> 166 fps. Near terrain looks the same; far terrain is simplified. Blocks whose look mods compute from the world are drawn the vanilla way. Stands aside (vanilla terrain) when another mod replaces the chunk renderer: Sodium, Embeddium and the shader mods on them.
#lab.voxel.stream=false

# GPU terrain: level of detail closer (from 4 chunks, coarser from 8) - for weak graphics; the middle distance looks coarser.
# (part of lab.voxel.stream)
#lab.voxel.stream.lodNear=false

# GPU terrain: terrain toward the screen edges and behind goes coarse sooner. A few more fps; after a fast turn detail fills in over a moment.
# (part of lab.voxel.stream)
#lab.voxel.stream.cone=false

# ==== Entity rendering ====
# Entities and block entities drawn in batches, without per-frame garbage.

# exp/entity-batch (client): immediate-mode draws batched per render type, for every renderer (vanilla or mod) that draws through a BufferSource.
#lab.opt.EntityBatchMixin=true

# exp/frame-garbage (client): EntityRenderer.shouldRender without the inflated AABB it makes per entity per frame.
# (part of lab.opt.FrameGarbageMixin)
#lab.opt.EntityCullNoAllocMixin=true

# exp/frame-garbage (client): EntityRenderer.getPackedLightCoords (final: no renderer overrides it) without its Vec3 and BlockPos when the probe and the light levels are the base implementations (NoAllocChecks); vanilla's body otherwise.
# (part of lab.opt.FrameGarbageMixin)
#lab.opt.EntityLightNoAllocMixin=true

# Items in the world (on the ground, in frames, in hands) drawn from GPU memory: a pose per item each frame instead of its vertices, no sorting of their quads. About 2x fps with a thousand dropped items.
#lab.opt.ItemGpuMixin=true

# Baked models that block entities and other renderers write every frame (machines' moving parts: Immersive Engineering's crushers, turrets...) drawn from GPU memory: a pose per part instead of its vertices, the same picture. About 1.5-1.7x fps with hundreds of working machines.
#lab.opt.QuadGpuMixin=true

# exp/modelpart-quat (client): ModelPart.render's loop over its children and compile's loop over its cubes use one reusable array iterator per part instead of a new iterator per call (the map's values iterator, the list iterator).
# (part of lab.opt.ModelPartQuatMixin)
#lab.opt.ModelPartIterMixin=true

# exp/modelpart-quat (client): translateAndRotate's new Quaternionf().rotationZYX(z, y, x) for PoseStack.mulPose uses one quaternion per part instead of a new one per call.
#lab.opt.ModelPartQuatMixin=true

# With Entity Model Features installed, its custom head and skull models stay on (the parallel entity renderers no longer make it switch them off).
# (part of lab.opt.ParallelEntitiesMixin)
#lab.opt.SkullSetShareMixin=true

# Shields, chests, heads and banners in item frames or on the ground are drawn safely on the extra render threads (no clash with the main thread).
# (part of lab.opt.ParallelEntitiesMixin)
#lab.opt.ItemRendererSetBewlrMixin=true

# exp/part-batch (client, render cache v3): a model part's compile becomes a queued record (pose, light, overlay, colour) drawn from its VRAM geometry, when PartBatch can take it; otherwise the vanilla compile.
#lab.opt.PartBatchMixin=true

# PartBatchMixin: the queued parts of the render type being drawn, right after its batch (program still bound).
# (part of lab.opt.PartBatchMixin, lab.opt.ItemGpuMixin)
#lab.opt.PartDrawMixin=true

# PartBatchMixin: no queued part outlives the level render.
# (part of lab.opt.PartBatchMixin, lab.opt.ItemGpuMixin)
#lab.opt.PartFrameMixin=true

# PartBatchMixin: which render type's batch is being drawn (1.20.1: RenderType.end draws a builder).
# (part of lab.opt.PartBatchMixin, lab.opt.ItemGpuMixin)
#lab.opt.PartTypeMixin=true

# exp/pose-pool (client): every pushPose allocated a Pose with a new Matrix4f and Matrix3f (18 % of the render thread's allocation in an entity-heavy scene).
#lab.opt.PoseStackPoolMixin=true

# exp/frame-garbage: Vec3.fromRGB24 (fog and sky colours: 216 fetches per sampler call, every frame, from a handful of biome colours) answered from a small direct-mapped cache.
# (part of lab.opt.FrameGarbageMixin)
#lab.opt.Vec3FromRgbMixin=true

# Particles ticked on Sleepium's worker threads when their tick proves to touch only the particle itself; the rest tick as before.
#lab.opt.ParallelParticlesMixin=true

# Particles drawn from compact records on the GPU instead of their vertices, with their light kept per block. Particle-heavy scenes (hundreds of working machines) about 2x fps; on an Intel N100 1.5 -> 53 fps.
#lab.opt.ParticleGpuMixin=true

# A particle's light read once per block position per frame (with the particle records).
# (part of lab.opt.ParticleGpuMixin)
#lab.opt.ParticleLightMemoMixin=true

# Particles' block-shape questions answered once per tick and block instead of once per particle (with parallel particles).
#lab.opt.ParticleShapeMemoMixin=true

