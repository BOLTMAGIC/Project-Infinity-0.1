#lab.opt.LightTimingMixin=true

# ShaderLightMixin: a light change goes to the light volumes (a volume refresh, or the vanilla re-mesh with recipes) instead of vanilla's re-mesh.
# (part of lab.opt.ShaderLightMixin)
#lab.opt.ShaderLightChunkCacheMixin=true

# ShaderLightMixin: a section compile with recipes (dynamic sections), the sentinel pass before each layer is ended.
