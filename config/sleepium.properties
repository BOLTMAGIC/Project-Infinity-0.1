# ==== Threads ====
# Main-thread reactor, parallel entities, reused pools.

# exp/lab-pools: vanilla's background and IO pools replaced by LabRuntime.
#lab.opt.LabPoolsMixin=true

# exp/mailbox-batch: let one executor dispatch of a mailbox drain up to N tasks instead of exactly one.
#lab.opt.MailboxBatchMixin=true

# ServerReactor stage 1: the server thread sleeps until something is to be done.
#lab.opt.MainReactor=true

# MainReactor: light updates are started by the server thread's polling (MainThreadExecutor.pollTask → tryScheduleUpdate) unless 1000 tasks queue up.
# (part of lab.opt.MainReactor)
#lab.opt.MainReactorLightMixin=true

# ServerReactor (light notifications): onLightUpdate notes the section in a LightNotifyRing; one drain task on the same main-thread executor vanilla uses applies every pending section (vanilla's body, once per section).
# (part of lab.opt.MainReactor)
#lab.opt.MainReactorLightNotifyMixin=true

# Measurement (lab.reactor.scout): a queued task ran right after a timeout wake — its producer did not signal.
# (part of lab.opt.MainReactor)
#lab.opt.MainReactorScoutLoopMixin=true

# Measurement (lab.reactor.scout): after the reactor woke by its timeout (no signal), which main-thread work was waiting — found only because the thread polled.
# (part of lab.opt.MainReactor)
#lab.opt.MainReactorScoutMixin=true

# ServerReactor stage 1 (MainReactor): the idle wait between ticks sleeps until work or the next tick.
# (part of lab.opt.MainReactor)
#lab.opt.MainReactorServerMixin=true

# exp/bus-composite: install CompositeEventBus as MinecraftForge.EVENT_BUS (1.21.1: NeoForgeBusMixin).
#lab.opt.ForgeBusMixin=true

# exp/parallel-render (client): the entity loop of renderLevel queues its entities (ParallelRender starts the eligible ones on workers at once) and the queue is drained in order right after the loop, before the batch is ended; a worker job is merged through renderEntity (its dispatcher call: ParallelR
#lab.opt.ParallelEntitiesMixin=true

# exp/persistent-pools: stop the engine from re-creating its worker threads.
#lab.opt.PersistentPoolsMixin=true

# WorldgenReactor (chunk loads): vanilla's scheduleChunkLoad hops to the main thread twice for every chunk it starts — thenApplyAsync(main) to create or deserialize it, then exceptionallyAsync(main), which the JDK runs on its executor even for a normal result — and each hop waited ~140 ms in the main 
# (part of lab.opt.WorldgenReactor)
#lab.opt.ReactorChunkLoadMixin=true

# WorldgenReactor: the level's main-thread executor also serves FullRing — within the idle budget when called from the idle loop, without a budget when the main thread blocks on a chunk future (managedBlock).
# (part of lab.opt.WorldgenReactor)
#lab.opt.ReactorExecutorMixin=true

# WorldgenReactor: the FULL step's executor puts its main-thread task into FullRing instead of the main mailbox.
# (part of lab.opt.WorldgenReactor)
#lab.opt.ReactorFullMixin=true

# WorldgenReactor: ServerChunkCache.pollTask is the server's idle-loop entry (MinecraftServer.pollTaskInternal, only while it has time): FullRing's window and deadline apply there.
# (part of lab.opt.WorldgenReactor)
#lab.opt.ReactorMainDrainMixin=true

# ServerReactor (chunk loads): inside ChunkSerializer.read on the pool, shared-state calls go to the ReadJournal.
# (part of lab.opt.WorldgenReactor)
#lab.opt.ReactorReadJournalMixin=true

# WorldgenReactor: FullRing's feedback — each server tick's duration adjusts its window; the idle phase's deadline (the next tick's start) bounds what it may run between ticks.
# (part of lab.opt.WorldgenReactor)
#lab.opt.ReactorTickMixin=true

# Dropped items and other non-living entities tick on Sleepium's worker threads in long runs, each exactly as vanilla ticks it; their moves in the entity storage are made in order after the run. A pile of 2 500 items: client tick 13.1 -> 11.5 ms; on an Intel N100 42.6 -> 60.9 fps.
#lab.opt.ParallelEntityTicksMixin=true

# exp/render-priority (client): the render thread (and the singleplayer server's) above the game's other threads, so a frame does not wait for its core behind background work - on a 4-core PC (Intel N100) stutters 7.9 -> 1.3 %, the slowest frames 50 -> 21 ms.
#lab.opt.RenderPriorityMixin=true

# Entities next to mods that hook their drawing (Shoulder Surfing, Entity Model Features...): at start Sleepium reads what such a mod passes from the entity dispatcher into the models; a mod that passes nothing a model reads no longer keeps every entity on the render thread, and what a worker read is checked again when the frame is put together. Up to a few seconds at start in large packs.
# (part of lab.opt.ParallelEntitiesMixin)
#lab.prender.fieldFlow=false

# ==== Network ====
# Bundled and coalesced packets.

# Large server data sent once by content hash: cached on the client's disk, resumed, deltas only, paced to the connection.
#lab.opt.NetBulk=true

# A flush's packets sent as one frame of a per-connection compressed stream (clients with Sleepium only): 45-52 % fewer bytes on movement traffic.
#lab.opt.NetCoalesce=true

# Network reactor, stage A: outbound batching.
#lab.opt.NetReactor=true

# NetReactor: a server connection in the PLAY protocol batches the server thread's sends (see NetReactor).
# (part of lab.opt.NetReactor)
#lab.opt.NetReactorConnectionMixin=true

# NetReactor: sends inside the server tick are batched; its end is a flush point (one task per connection).
# (part of lab.opt.NetReactor)
#lab.opt.NetReactorTickMixin=true

# NetReactor: before the server thread sleeps (waitForTasks) its pending batches go out.
# (part of lab.opt.NetReactor)
#lab.opt.NetReactorWaitMixin=true

