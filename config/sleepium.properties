# GeckoLib's Molang variables are global (query.anim_time is set by every controller before its keyframes are read, GeoModel.applyMolangQueries sets the entity's queries before each render): inside a ParallelRender job a set goes to the job's own values and a get reads them first, then the global one 
# (part of lab.opt.GeoParallelMixin, lab.opt.ParallelEntitiesMixin)
