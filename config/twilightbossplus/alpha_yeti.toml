
[alpha_yeti]
	#启用雪怪首领增强，关闭后保持暮色原版；开启时原版冰弹与原版暴走被新技能取代，抓人投掷与疲惫保留
	#Enable the Alpha Yeti rework; disable to keep vanilla. When enabled the vanilla ice bombs and rampage are replaced, grabbing and tiredness are kept
	enabled = true
	#最大生命倍率
	#Max health multiplier
	#Range: 0.1 ~ 100.0
	health_multiplier = 2.6
	#基础攻击力，雪怪首领原版攻击力只有 1，所有技能伤害以此为基础
	#Base attack damage; the vanilla Alpha Yeti only has 1 attack damage so every skill scales from this value
	#Range: 0.0 ~ 1000.0
	base_attack = 9.0
	#攻击力倍率
	#Attack damage multiplier
	#Range: 0.1 ~ 100.0
	attack_multiplier = 1.2
	#技能击退倍率，再乘以 1 - 击退抗性
	#Skill knockback multiplier, also scaled by 1 - knockback resistance
	#Range: 0.0 ~ 2.0
	skill_knockback = 1.0
	#两个技能之间的最短间隔（tick）
	#Minimum ticks between two skills
	#Range: 0 ~ 1200
	skill_interval_ticks = 30
	#冰霜技能每次命中增加的冻结值，原版完全冻结需要 140，穿皮革护甲可免疫
	#Freeze ticks added by each frost hit; vanilla needs 140 to be fully frozen, leather armor grants immunity
	#Range: 0 ~ 1000
	freeze_ticks = 100
	#疲惫时受到的额外伤害比例
	#Extra damage ratio taken while tired
	#Range: 0.0 ~ 10.0
	tired_damage_bonus = 0.3

	[alpha_yeti.phase]
		#进入二阶段的血量比例，进入时强制释放霜晶棋盘
		#Health ratio to enter phase two; forces Permafrost Field
		#Range: 0.0 ~ 1.0
		phase_two_health = 0.6
		#进入三阶段的血量比例，进入时强制白魇暴走
		#Health ratio to enter phase three; forces Whiteout Rampage
		#Range: 0.0 ~ 1.0
		phase_three_health = 0.3
		#三阶段技能冷却倍率
		#Skill cooldown multiplier in phase three
		#Range: 0.1 ~ 1.0
		rage_cooldown_multiplier = 0.7

	#全阶段：霜冻合掌，双臂张开后猛然合掌，前方扇形喷出冰霜，造成伤害并冻结
	#All phases: Frost Clap, a frontal frost cone that damages and freezes
	[alpha_yeti.frost_clap]
		#启用霜冻合掌
		#Enable Frost Clap
		enabled = true
		#霜冻合掌冷却（tick）
		#Frost Clap cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 40
		#霜冻合掌伤害倍率，伤害 = 雪怪首领攻击力 * 倍率
		#Frost Clap damage multiplier; damage = Alpha Yeti attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.0

	#全阶段：雪崩扑击，下蹲蓄力后跃向目标，落点出现雪花预警，落地冲击并冻结
	#All phases: Avalanche Pounce, leaps at the target with a telegraphed landing that damages and freezes
	[alpha_yeti.avalanche_pounce]
		#启用雪崩扑击
		#Enable Avalanche Pounce
		enabled = true
		#雪崩扑击冷却（tick）
		#Avalanche Pounce cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 70
		#雪崩扑击伤害倍率，伤害 = 雪怪首领攻击力 * 倍率
		#Avalanche Pounce damage multiplier; damage = Alpha Yeti attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.3

	#全阶段：巨雪滚球，搓出雪球滚向目标并越滚越大，侧移即可躲避，三阶段一次三颗
	#All phases: Rolling Snowball, a growing snowball rolls at the target; sidestep to dodge, three at once in phase three
	[alpha_yeti.rolling_snowball]
		#启用巨雪滚球
		#Enable Rolling Snowball
		enabled = true
		#巨雪滚球冷却（tick）
		#Rolling Snowball cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 80
		#巨雪滚球伤害倍率，伤害 = 雪怪首领攻击力 * 倍率
		#Rolling Snowball damage multiplier; damage = Alpha Yeti attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.4

	#二阶段：霜晶棋盘，地面铺开冰砖棋盘，交替亮起后刺出冰棘，雪怪脚下一格每轮都会刺出
	#Phase 2: Permafrost Field, a checkerboard of ice tiles lights up in turns and erupts into spikes; the tile under the yeti erupts every wave
	[alpha_yeti.permafrost_field]
		#启用霜晶棋盘
		#Enable Permafrost Field
		enabled = true
		#霜晶棋盘冷却（tick）
		#Permafrost Field cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 150
		#霜晶棋盘伤害倍率，伤害 = 雪怪首领攻击力 * 倍率
		#Permafrost Field damage multiplier; damage = Alpha Yeti attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.1
		#冰棘轮数
		#Number of spike waves
		#Range: 1 ~ 12
		waves = 3

	#受伤累计触发：白魇暴走，取代原版暴走，咆哮后连续扑击，每次落地放射冰晶，结束后进入原版疲惫
	#Triggered by damage taken: Whiteout Rampage, replaces the vanilla rampage with chained pounces that release ice shards, then the yeti gets tired
	[alpha_yeti.whiteout_rampage]
		#启用白魇暴走
		#Enable Whiteout Rampage
		enabled = true
		#白魇暴走冷却（tick）
		#Whiteout Rampage cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 1
		#白魇暴走伤害倍率，伤害 = 雪怪首领攻击力 * 倍率
		#Whiteout Rampage damage multiplier; damage = Alpha Yeti attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.2
		#累计受到该比例最大生命的伤害后触发暴走
		#Rampage triggers after taking this ratio of max health as damage
		#Range: 0.01 ~ 1.0
		damage_ratio = 0.18
		#暴走扑击次数，三阶段 +1
		#Pounces per rampage, +1 in phase three
		#Range: 1 ~ 10
		leaps = 3
		#落地冰晶伤害倍率
		#Ice shard damage multiplier
		#Range: 0.0 ~ 100.0
		shard_multiplier = 0.6

