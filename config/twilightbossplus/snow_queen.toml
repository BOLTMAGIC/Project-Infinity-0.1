
[snow_queen]
	#启用冰雪女王增强，关闭后保持暮色原版；开启时原版召唤、下坠与冰息循环被新技能取代
	#Enable the Snow Queen rework; disable to keep vanilla. When enabled the vanilla summon, drop and breath cycle is replaced
	enabled = true
	#最大生命倍率
	#Max health multiplier
	#Range: 0.1 ~ 100.0
	health_multiplier = 2.6
	#攻击力倍率，技能伤害以女王攻击力为基础
	#Attack damage multiplier; every skill scales from the queen's attack damage
	#Range: 0.1 ~ 100.0
	attack_multiplier = 1.2
	#技能击退倍率，再乘以 1 - 击退抗性
	#Skill knockback multiplier, also scaled by 1 - knockback resistance
	#Range: 0.0 ~ 2.0
	skill_knockback = 1.0
	#两个技能之间的最短间隔（tick）
	#Minimum ticks between two skills
	#Range: 0 ~ 1200
	skill_interval_ticks = 30
	#冰霜技能每次命中增加的冻结值，原版完全冻结需要 140，穿皮革护甲可免疫
	#Freeze ticks added by each frost hit; vanilla needs 140 to be fully frozen, leather armor grants immunity
	#Range: 0 ~ 1000
	freeze_ticks = 90
	#空闲时环绕目标的悬浮高度
	#Hover height above the target while idle
	#Range: 1.0 ~ 16.0
	hover_height = 3.5

	[snow_queen.phase]
		#进入二阶段的血量比例，进入时强制召唤冰晶廷卫
		#Health ratio to enter phase two; forces Crystal Court
		#Range: 0.0 ~ 1.0
		phase_two_health = 0.6
		#进入三阶段的血量比例，进入时强制极光折镜
		#Health ratio to enter phase three; forces Aurora Mirrors
		#Range: 0.0 ~ 1.0
		phase_three_health = 0.3
		#三阶段技能冷却倍率
		#Skill cooldown multiplier in phase three
		#Range: 0.1 ~ 1.0
		rage_cooldown_multiplier = 0.7

	#全阶段近战：霜刃圆舞，俯冲贴地旋转，六片冰刃先外扩再回收，贴身或远离可躲
	#All phases, close range: Frost Waltz, six ice blades spiral outwards then back; stay hugged or far away
	[snow_queen.frost_waltz]
		#启用霜刃圆舞
		#Enable Frost Waltz
		enabled = true
		#霜刃圆舞冷却（tick）
		#Frost Waltz cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 50
		#霜刃圆舞伤害倍率，伤害 = 冰雪女王攻击力 * 倍率
		#Frost Waltz damage multiplier; damage = Snow Queen attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 0.9

	#全阶段近战：镜冰反击，展开镜面冰壳并减伤，被攻击时立即碎裂反击，未被攻击则结束时小范围爆开
	#All phases, close range: Mirror Shell, a mirror shell reduces damage and shatters into a counter when struck, otherwise bursts weakly at the end
	[snow_queen.mirror_shell]
		#启用镜冰反击
		#Enable Mirror Shell
		enabled = true
		#镜冰反击冷却（tick）
		#Mirror Shell cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 80
		#镜冰反击伤害倍率，伤害 = 冰雪女王攻击力 * 倍率
		#Mirror Shell damage multiplier; damage = Snow Queen attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.2
		#冰壳期间的减伤比例
		#Damage reduction while the shell is up
		#Range: 0.0 ~ 1.0
		damage_reduction = 0.6

	#全阶段：霜痕描摹，升空吐出冰息在地面描线追踪目标，线上霜花按描绘顺序依次绽放
	#All phases: Rime Trace, the breath draws a chasing line on the ground and frost flowers bloom along it in order
	[snow_queen.rime_trace]
		#启用霜痕描摹
		#Enable Rime Trace
		enabled = true
		#霜痕描摹冷却（tick）
		#Rime Trace cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 70
		#霜痕描摹伤害倍率，伤害 = 冰雪女王攻击力 * 倍率
		#Rime Trace damage multiplier; damage = Snow Queen attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.0

	#全阶段：冰棺封印，在玩家脚下升起六面冰棺，后半段棺壁会把人推回棺内，闭合时封冻并造成伤害
	#All phases: Glacial Coffin, a hexagonal coffin rises around players; its walls push back inwards late, closing freezes and damages
	[snow_queen.glacial_coffin]
		#启用冰棺封印
		#Enable Glacial Coffin
		enabled = true
		#冰棺封印冷却（tick）
		#Glacial Coffin cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 110
		#冰棺封印伤害倍率，伤害 = 冰雪女王攻击力 * 倍率
		#Glacial Coffin damage multiplier; damage = Snow Queen attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.3
		#被封住后的缓慢时长（tick）
		#Slowness duration in ticks after being sealed
		#Range: 0 ~ 1200
		slow_ticks = 50
		#一次最多封印的玩家数
		#Max players sealed per cast
		#Range: 1 ~ 16
		max_targets = 3

	#二阶段：冰晶廷卫，召唤暮色原版冰晶守卫，并向四周释放极光脉冲
	#Phase 2: Crystal Court, summons Twilight Forest ice crystals and releases an aurora pulse
	[snow_queen.crystal_court]
		#启用冰晶廷卫
		#Enable Crystal Court
		enabled = true
		#冰晶廷卫冷却（tick）
		#Crystal Court cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 250
		#冰晶廷卫伤害倍率，伤害 = 冰雪女王攻击力 * 倍率
		#Crystal Court damage multiplier; damage = Snow Queen attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 0.6
		#每次召唤的冰晶数量
		#Ice crystals per summon
		#Range: 0 ~ 12
		crystals = 3

	#三阶段：极光折镜，立起六面冰镜，极光在镜间折射，第一轮六芒星中心安全，第二轮外圈六边形内部安全
	#Phase 3: Aurora Mirrors, six ice mirrors reflect aurora beams; first a hexagram with a safe center, then the outer hexagon with a safe inside
	[snow_queen.aurora_mirrors]
		#启用极光折镜
		#Enable Aurora Mirrors
		enabled = true
		#极光折镜冷却（tick）
		#Aurora Mirrors cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 180
		#极光折镜伤害倍率，伤害 = 冰雪女王攻击力 * 倍率
		#Aurora Mirrors damage multiplier; damage = Snow Queen attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.4
		#折射轮数，六芒星与六边形交替
		#Number of reflection cycles, alternating hexagram and hexagon
		#Range: 1 ~ 8
		cycles = 2

