
[ur_ghast]
	#启用暮初恶魂增强，关闭后保持暮色原版；开启时原版火球与暴怒泪雨伤害被新技能取代，召唤小恶魂与暴怒减伤保留
	#Enable the Ur-Ghast rework; disable to keep vanilla. When enabled the vanilla fireballs and tantrum tear damage are replaced, minion summoning and tantrum damage reduction are kept
	enabled = true
	#最大生命倍率
	#Max health multiplier
	#Range: 0.1 ~ 100.0
	health_multiplier = 2.4
	#基础攻击力，恶魂本身没有攻击力属性，所有技能伤害以此为基础
	#Base attack damage; the Ur-Ghast has no attack attribute so every skill scales from this value
	#Range: 0.0 ~ 1000.0
	base_attack = 10.0
	#攻击力倍率
	#Attack damage multiplier
	#Range: 0.1 ~ 100.0
	attack_multiplier = 1.2
	#技能击退倍率，再乘以 1 - 击退抗性
	#Skill knockback multiplier, also scaled by 1 - knockback resistance
	#Range: 0.0 ~ 2.0
	skill_knockback = 1.0
	#两个技能之间的最短间隔（tick）
	#Minimum ticks between two skills
	#Range: 0 ~ 1200
	skill_interval_ticks = 40

	[ur_ghast.phase]
		#进入二阶段的血量比例，进入时强制释放泪晶棱阵
		#Health ratio to enter phase two; forces Tear Prism
		#Range: 0.0 ~ 1.0
		phase_two_health = 0.6
		#进入三阶段的血量比例，进入时强制释放赤泪雷殛
		#Health ratio to enter phase three; forces Crimson Lightning
		#Range: 0.0 ~ 1.0
		phase_three_health = 0.3
		#三阶段技能冷却倍率
		#Skill cooldown multiplier in phase three
		#Range: 0.1 ~ 1.0
		rage_cooldown_multiplier = 0.7

	#全阶段：泪珠追魂，赤晶泪珠先环绕恶魂，再逐颗射出并缓慢追踪目标，命中或撞墙时溅开
	#All phases: Tear Volley, crimson tears orbit the Ur-Ghast and are fired one by one, slowly homing and splashing on impact
	[ur_ghast.tear_volley]
		#启用泪珠追魂
		#Enable Tear Volley
		enabled = true
		#泪珠追魂冷却（tick）
		#Tear Volley cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 45
		#泪珠追魂伤害倍率，伤害 = 恶魂攻击力 * 倍率
		#Tear Volley damage multiplier; damage = Ur-Ghast attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 0.8
		#一轮泪珠数量，二阶段起额外 +2
		#Tears per volley, +2 from phase two
		#Range: 1 ~ 30
		tears = 6

	#全阶段：恸哭锥波，恶魂吸气后朝目标发出三道锥形声浪，命中造成伤害并减速，侧移出锥形范围即可躲避
	#All phases: Wailing Cone, three cone-shaped sound waves toward the target that damage and slow; step out of the cone to dodge
	[ur_ghast.wailing_cone]
		#启用恸哭锥波
		#Enable Wailing Cone
		enabled = true
		#恸哭锥波冷却（tick）
		#Wailing Cone cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 70
		#恸哭锥波伤害倍率，伤害 = 恶魂攻击力 * 倍率
		#Wailing Cone damage multiplier; damage = Ur-Ghast attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 0.7
		#声浪造成的缓慢时长（tick）
		#Slowness duration from a wave in ticks
		#Range: 0 ~ 600
		slowness_ticks = 40

	#暴怒时：泪幕风暴，取代原版暴怒的泪水伤害，恶魂身下形成乌云，带缺口的泪水雨幕从玩家身旁横扫而过，从缺口穿过即可躲避
	#During tantrum: Tear Curtain, replaces the vanilla tantrum damage with sweeping walls of tear rain that each have a gap to slip through
	[ur_ghast.tear_storm]
		#启用泪幕风暴
		#Enable Tear Curtain
		enabled = true
		#泪幕风暴冷却（tick）
		#Tear Curtain cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 1
		#泪幕风暴伤害倍率，伤害 = 恶魂攻击力 * 倍率
		#Tear Curtain damage multiplier; damage = Ur-Ghast attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 0.5
		#每名玩家两道雨幕之间的间隔（tick），三阶段缩短 30%
		#Ticks between two curtains per player, 30% shorter in phase three
		#Range: 10 ~ 1200
		interval_ticks = 50

	#二阶段：泪晶棱阵，目标周围升起六颗泪晶，两两对穿连成三道贯穿中心的光束，先闪烁预警再点亮，每轮旋转角度不同，站在光束间隙即可躲避
	#Phase 2: Tear Prism, six crystals rise around the target and link into three beams through the center; each cycle flashes a warning first and rotates, stand between the beams to dodge
	[ur_ghast.tear_prism]
		#启用泪晶棱阵
		#Enable Tear Prism
		enabled = true
		#泪晶棱阵冷却（tick）
		#Tear Prism cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 160
		#泪晶棱阵伤害倍率，伤害 = 恶魂攻击力 * 倍率
		#Tear Prism damage multiplier; damage = Ur-Ghast attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 0.9
		#光束轮数
		#Number of beam cycles
		#Range: 1 ~ 20
		cycles = 4

	#三阶段：赤泪雷殛，赤红雷电追着目标落下，每道雷落下前地面都有预警
	#Phase 3: Crimson Lightning, telegraphed crimson bolts chase the target
	[ur_ghast.crimson_lightning]
		#启用赤泪雷殛
		#Enable Crimson Lightning
		enabled = true
		#赤泪雷殛冷却（tick）
		#Crimson Lightning cooldown in ticks
		#Range: 1 ~ 12000
		cooldown_ticks = 180
		#赤泪雷殛伤害倍率，伤害 = 恶魂攻击力 * 倍率
		#Crimson Lightning damage multiplier; damage = Ur-Ghast attack damage * multiplier
		#Range: 0.0 ~ 100.0
		multiplier = 1.6
		#雷击次数
		#Number of strikes
		#Range: 1 ~ 40
		strikes = 8

