#Toolkit slot count. At least 18 slots are required for the two toolkit hotbars.
#Range: 18 ~ 640
toolkitSlotCount = 64
#Actively refresh the pattern management provider list while it is visible. Disabled keeps one-shot refreshes only.
patternProviderActiveRefresh = false
#Maximum number of non-empty pattern slots synchronized per provider to avoid oversized network packets.
#Range: 1 ~ 32767
maxSyncedSlotsPerProvider = 1024

