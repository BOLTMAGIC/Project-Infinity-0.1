
#凋零基础属性
[wither]
	#是否增强所有凋零；false 时恢复原版凋零
	enhanceAll = true
	#凋零最大生命值
	#Range: 1.0 ~ 1000000.0
	maxHealth = 1200.0
	#凋零基础攻击力，所有技能伤害 = 基础攻击力 × 技能倍率
	#Range: 0.0 ~ 10000.0
	attackDamage = 24.0
	#击退整体倍率，实际击退还会乘以 (1 - 击退抗性)
	#Range: 0.0 ~ 10.0
	knockbackMultiplier = 0.5
	#进入第二阶段的血量百分比
	#Range: 0.0 ~ 1.0
	stageTwoHealth = 0.5
	#进入第三阶段的血量百分比
	#Range: 0.0 ~ 1.0
	stageThreeHealth = 0.2
	#两次技能之间的最短间隔（tick）
	#Range: 0 ~ 10000
	actionInterval = 50
	#第三阶段冷却倍率
	#Range: 0.05 ~ 10.0
	rageCooldownMultiplier = 0.6
	#索敌范围
	#Range: 8.0 ~ 512.0
	combatRange = 48.0
	#技能命中附加凋零效果的秒数，0 为不附加
	#Range: 0 ~ 600
	witherSeconds = 4
	#技能命中附加凋零效果的等级（0 为 I 级）
	#Range: 0 ~ 9
	witherAmplifier = 1
	#输出技能调试日志
	debugLogging = false

